name: SKTCH
options:
  bundleIdPrefix: com.kydlo
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ARCHS: arm64
    VALID_ARCHS: arm64
    ENABLE_PREVIEWS: YES
    GENERATE_INFOPLIST_FILE: YES

targets:
  SKTCH:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SKTCH
        createIntermediateGroups: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kydlo.sktch
        PRODUCT_NAME: SKTCH
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        DEVELOPMENT_TEAM: ""
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
    preBuildScripts: []

  SKTCHTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SKTCHTests
        createIntermediateGroups: true
    dependencies:
      - target: SKTCH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kydlo.sktch.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SKTCH.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SKTCH"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
